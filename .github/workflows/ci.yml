name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, layering, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: biwork, POSTGRES_PASSWORD: biwork, POSTGRES_DB: biwork_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U biwork" --health-interval 5s --health-retries 20
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Install OCR engine
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus tesseract-ocr-uzb tesseract-ocr-uzb-cyrl
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Create the application database role
        run: PGPASSWORD=biwork psql -h localhost -U biwork -d biwork_test -c "CREATE ROLE biwork_app LOGIN PASSWORD 'biwork_app' NOBYPASSRLS"
      - run: ruff check app tests scripts
      - name: Layering contracts
        run: lint-imports
      - run: pytest
      - name: OpenAPI schema is current
        run: python scripts/export_openapi.py && git diff --exit-code openapi.json

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: API types match the OpenAPI schema
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: biwork, POSTGRES_PASSWORD: biwork, POSTGRES_DB: biwork }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U biwork" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: dev
      CELERY_ALWAYS_EAGER: "true"
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Prepare database and API
        working-directory: backend
        run: |
          pip install -e .
          PGPASSWORD=biwork psql -h localhost -U biwork -d biwork -c "CREATE ROLE biwork_app LOGIN PASSWORD 'biwork_app' NOBYPASSRLS"
          alembic upgrade head
          python -m app.cli bootstrap
          python -m app.cli seed-demo
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health/ready && break; sleep 1; done
      - name: Install frontend and browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
