[project]
name = "biwork-backend"
version = "0.1.0"
description = "BIWORK — AI-powered manufacturing management platform (backend API, BIWORK Agent pipeline, worker)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "pytesseract>=0.3.10",
    "filetype>=1.2",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "openai>=3.30",
    "google-genai>=2.30",
    "anthropic>=1.0",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "PyJWT>=2.9",
    "cryptography>=43",
    "pyotp>=2.9",
    "charset-normalizer>=3.3",
    "boto3>=1.35",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "reportlab>=4.2",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai/prompts/*/*.md", "ai/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]
